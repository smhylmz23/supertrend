name: Supertrend Tarama

on:
  schedule:
    # Saatler UTC'dir. Turkiye = UTC+3 (yaz saati uygulanmiyor).
    #
    # GitHub'in ucretsiz zamanlayicisi "kesin" degildir: yogunlukta kosuyu
    # saatlerce geciktirebilir ya da o slotu tamamen atlayabilir. Bu yuzden
    # tek saate guvenmiyoruz; ayni gun icin bes ayri deneme var.
    # Hangisi once veriyi getirirse getirsin, kalanlar "yayindaki veri zaten
    # son kapanisa ait" deyip hicbir sey yapmadan cikar.
    - cron: '45 15 * * 1-5'   # 18:45 TR  - asil deneme
    - cron: '30 16 * * 1-5'   # 19:30 TR  - yedek
    - cron: '30 17 * * 1-5'   # 20:30 TR  - yedek
    - cron: '30 19 * * 1-5'   # 22:30 TR  - yedek
    - cron: '0 4 * * 2-6'     # 07:00 TR  - ertesi sabah, son sans
    #
    # CUMA'YA OZEL EK DENEMELER
    # Cloudflare'in gun numaralari farkli (1 = Pazar), bu yuzden oradaki
    # zamanlayici Pazar-Persembe calisiyor ve Cuma aksamini kacirtiyor.
    # O ayar duzeltilene kadar Cuma tamamen GitHub'a kaliyor; GitHub da
    # gecikebildigi icin o gune fazladan deneme koyuyoruz. Veri zaten
    # guncelse hepsi hicbir sey yapmadan cikar, maliyeti yok.
    - cron: '0 16 * * 5'      # 19:00 TR  Cuma
    - cron: '0 17 * * 5'      # 20:00 TR  Cuma
    - cron: '0 18 * * 5'      # 21:00 TR  Cuma
    - cron: '0 21 * * 5'      # 00:00 TR  Cumartesi gecesi
    - cron: '0 6 * * 6'       # 09:00 TR  Cumartesi sabahi
  workflow_dispatch:          # elle ya da Cloudflare zamanlayicisindan
    inputs:
      zorla:
        description: 'Veri zaten guncel olsa bile yeniden tara (evet / hayir)'
        default: 'evet'
  push:
    branches: [main]          # kod degisince test amacli calissin

permissions:
  contents: write

# Iki cron ust uste binerse ayni anda iki tarama calismasin.
concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tarama gerekli mi
        id: kontrol
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.zorla }}" = "evet" ]; then
            echo "Kod degisikligi ya da 'zorla' emri - tarama yapilacak."
            echo "calis=evet" >> $GITHUB_OUTPUT
          elif [ "$(node taze-mi.mjs)" = "EVET" ]; then
            echo "Yayindaki veri zaten borsanin son kapanisina ait - tarama atlaniyor."
            echo "calis=hayir" >> $GITHUB_OUTPUT
          else
            echo "Yeni kapanis var - tarama yapilacak."
            echo "calis=evet" >> $GITHUB_OUTPUT
          fi

      - name: Supertrend taramasi
        if: steps.kontrol.outputs.calis == 'evet'
        run: node supertrend-tarayici.mjs --sinyal hepsi --csv --rapor

      - name: Konfluans taramasi (KP paneli + osilator)
        if: steps.kontrol.outputs.calis == 'evet'
        run: node konfluans-tarayici.mjs --sinyal tumu --csv --rapor

      - name: Sonuclari kaydet
        if: steps.kontrol.outputs.calis == 'evet'
        run: |
          git config user.name "Supertrend Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonuclar index.html surum.txt st-durum.json SON-TARAMA.txt SON-KONFLUANS.txt hisseler.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Tarama sonucu: $(TZ=Europe/Istanbul date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
