name: Supertrend Tarama

on:
  schedule:
    # 15:45 UTC = 18:45 Turkiye saati, Pazartesi-Cuma
    - cron: '45 15 * * 1-5'
  workflow_dispatch:        # elle de calistirilabilsin
  push:
    branches: [main]        # kod degisince test amacli calissin

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Supertrend taramasi
        run: node supertrend-tarayici.mjs --sinyal hepsi --csv --rapor

      - name: Konfluans taramasi (KP paneli + osilator)
        run: node konfluans-tarayici.mjs --sinyal tumu --csv --rapor

      - name: Sonuclari kaydet
        run: |
          git config user.name "Supertrend Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonuclar index.html SON-TARAMA.txt SON-KONFLUANS.txt hisseler.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Tarama sonucu: $(date -u -d '+3 hours' +%Y-%m-%d)"
            git push
          fi
